<!DOCTYPE html>
<html>
<head>
    <title>RAG Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="main">
    <div class="card">

        <h1>🧠 RAG Chatbot</h1>
        <p class="subtitle">
            AI-powered conversation analysis system with topic tracking & persona extraction
        </p>

        <form method="POST" class="chat-box">
            <input type="text" name="query" placeholder="Ask something..." required>
            <button type="submit">Ask</button>
        </form>

        {% if answer %}
        <div class="chat-response">
            <div class="bot-label">Response</div>
            <div class="response-content">
                {{ answer | safe }}
            </div>
        </div>
        {% endif %}

    </div>
</div>

<!-- FOOTER -->
<div class="footer">
    ⚡ RAG Chatbot | KaStack Labs | Built by Ashish
</div>

</body>
</html>
